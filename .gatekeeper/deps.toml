growth = 10

[cargo]
aes-gcm = "web push: RFC 8291 encryption, crypto is never written in-house"
base64 = "web push and paired-device tokens: base64url, a proven codec"
blocks = "the typed UI blocks and their JSON Schema, our own crate pinned by commit"
farrier-service = "launchd and systemd jobs, written, loaded and restarted by farrier"
flate2 = "gzip replies: compression is never written in-house"
futures-util = "the streams of the server's SSE and websocket replies"
hkdf = "web push key derivation (RFC 8291): crypto is never written in-house"
p256 = "web push ECDH and the ES256 VAPID JWT: crypto is never written in-house"
qrcode = "cooee pair's QR code in the terminal"
rusqlite = "the thread items and their search index: SQLite built in"
ruzstd = "the store's archived threads: zstd compression is never written in-house"
security-framework = "the macOS keychain calls for cooee's secrets"
serde = "derive the parsing of config, API and store files"
serde_json = "the JSON API, the store's records and the blocks"
sha2 = "paired-device token hashes and pinned checksums: a hash is never written in-house"
shed-catalog = "shed's agent records, one shed release pin with shed-client (#760, approved by the owner)"
shed-client = "the one shed socket client and its test fake, pinned at a shed release (#760, approved by the owner)"
swag = "the colour schemes and theme packs, our own crate pinned by commit"
thiserror = "the error types of every crate"
tokio = "the async runtime of the server"
toml = "parse config and pack files: a parser of files from outside"
toml_edit = "surgical config saves: only the touched keys change, comments stay"
topcoat = "the web framework of cooee serve"

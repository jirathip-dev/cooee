label = "GitHub"
publisher = "GitHub (GitHub, Inc.)"
url = "https://api.githubcopilot.com/mcp/"
transport = "http"
leaves = "What the persona asks GitHub for or writes to it: searches, repository, issue and pull request content."
reviewed = 2026-11-17

[auth]
kind = "token"
header = "Authorization"
prefix = "Bearer "
help = "A fine-grained personal access token from github.com/settings/personal-access-tokens, scoped to the repositories this persona may use."

[tools]
read = [
  "get_commit", "get_file_contents", "get_label", "get_latest_release", "get_me", "get_release_by_tag", "get_tag",
  "get_team_members", "get_teams", "issue_read", "list_branches", "list_commits", "list_issue_fields",
  "list_issue_types", "list_issues", "list_pull_requests", "list_releases", "list_repository_collaborators",
  "list_tags", "pull_request_read", "run_secret_scanning", "search_code", "search_commits", "search_issues",
  "search_pull_requests", "search_repositories", "search_users", "ui_get",
]
write = [
  "add_comment_to_pending_review", "add_issue_comment", "add_reply_to_pull_request_comment", "create_branch",
  "create_or_update_file", "create_pull_request", "fork_repository", "issue_write", "pull_request_review_write",
  "push_files", "request_copilot_review", "sub_issue_write", "update_issue_comment", "update_pull_request",
  "update_pull_request_branch",
]
never = ["create_repository", "delete_file", "merge_pull_request"]

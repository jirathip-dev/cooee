included:
  - Sources
  - Tests
  - Cooee
  - UITests
disabled_rules:
  - colon
  - comma
  - comment_spacing
  - control_statement
  - force_cast
  - force_try
  - leading_whitespace
  - line_length
  - opening_brace
  - orphaned_doc_comment
  - return_arrow_whitespace
  - statement_position
  - todo
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_whitespace
analyzer_rules:
  - unused_import
unused_import:
  always_keep_imports:
    - ComposableArchitecture
file_length:
  warning: 250
  error: 250
  ignore_comment_only_lines: true
type_body_length:
  warning: 150
  error: 150
function_body_length:
  warning: 25
  error: 25
cyclomatic_complexity:
  warning: 8
  error: 8
nesting:
  type_level:
    warning: 2
    error: 2
  function_level:
    warning: 2
    error: 2
opt_in_rules:
  - implicitly_unwrapped_optional
implicitly_unwrapped_optional:
  mode: all
  severity: error
custom_rules:
  no_print:
    regex: '\bprint\('
    message: "#203: no print(; show it in the UI or return it"
    severity: error
  no_dispatch_queue:
    regex: '\bDispatchQueue\b'
    excluded: "Sources/CooeeAPI/Nearby.swift"
    message: "#203: no DispatchQueue; use Swift concurrency (Nearby.swift only: Network's browser takes a queue)"
    severity: error
  user_defaults_in_client:
    regex: 'UserDefaults\.standard'
    excluded: "Sources/CooeeApp/Live.swift"
    message: "#203: UserDefaults.standard only in its Features @Dependency client's live value (CooeeApp/Live.swift)"
    severity: error
  task_sleep_behind_clock:
    regex: 'Task\.sleep'
    message: "#203: no Task.sleep; sleep on a clock dependency (@Dependency(\\.continuousClock), an injected Clock)"
    severity: error
  fatal_error_needs_safety:
    regex: '(^|\n)(?![ \t]*// SAFETY:)[^\n]*\n[ \t]*fatalError\('
    message: "#203: no fatalError without a // SAFETY: line right above it"
    severity: error

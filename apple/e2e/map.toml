# #430: which simulator e2e tests a merge-ready run of .github/workflows/apple.yml runs for the paths a PR changes,
# read by scripts/e2e-scope.sh. Each line: "glob" = "tests"; a glob is a shell `case` pattern (`*` crosses `/`), and
# every line a path matches counts. `all` runs the whole suite, `none` no e2e test (the builds and apple-check still
# run). A path under apple/ that no line matches runs the whole suite; any other path no line matches runs none.
# Tests are the UI test classes (every `LiveUITestCase` class must be named here) and LivePersonaTests.
[paths]
# Shared: the workflow, this map, its script, the e2e server, models, clients, the app shell and the design system.
".github/workflows/apple.yml" = "all"
".github/actions/mac-runner/*" = "all"
"scripts/e2e-scope.sh" = "all"
"apple/e2e/map.toml" = "all"
"apple/e2e/serve.sh" = "all"
"apple/Package.swift" = "all"
"apple/Package.resolved" = "all"
"apple/Sources/CooeeCore/*" = "all"
"apple/Sources/CooeeAPI/*" = "all"
"apple/Sources/CooeeApp/*" = "all"
"apple/Sources/CooeeUI/Theme.swift" = "all"
"apple/Sources/CooeeUI/Components.swift" = "all"
"apple/Sources/CooeeUI/Root.swift" = "all"
"apple/Cooee/*" = "all"
"apple/UITests/Live/LiveUITestCase.swift" = "all"
"apple/UITests/Live/LiveUITests.swift" = "all"
"design-system/*" = "all"
# The server the app talks to: its crates, `cooee serve`, the fake agent serve.sh runs, and what they all compile.
"crates/cooee-server/*" = "all"
"crates/cooee-core/*" = "all"
"crates/cooee-machines/*" = "all"
"crates/cooee/src/main.rs" = "all"
"crates/cooee/tests/chat.rs" = "all"
"crates/cooee/tests/support/*" = "all"
"Cargo.toml" = "all"
"Cargo.lock" = "all"
"rust-toolchain.toml" = "all"
# Screens.
"apple/Sources/CooeeUI/Persona*" = "LivePersonaUITests LivePersonaTests"
"apple/Sources/CooeeFeatures/PersonaFeature.swift" = "LivePersonaUITests LivePersonaTests"
"apple/UITests/LivePersonaUITests.swift" = "LivePersonaUITests LivePersonaTests"
"apple/Tests/CooeeAPITests/LiveTests.swift" = "LivePersonaTests"
"apple/Sources/CooeeUI/AppIconPicker.swift" = "LiveIconUITests"
"apple/UITests/LiveIconUITests.swift" = "LiveIconUITests LiveStyleUITests"
"apple/Sources/CooeeUI/Menu.swift" = "LiveIconUITests LiveStyleUITests"
"apple/Sources/CooeeFeatures/MenuFeature.swift" = "LiveIconUITests LiveStyleUITests"
"apple/UITests/StyleUITests.swift" = "LiveStyleUITests"
"apple/Sources/CooeeUI/Chat.swift" = "LiveUITests LiveChatUITests LiveStyleUITests LiveChatStyleUITests"
"apple/Sources/CooeeUI/Composer.swift" = "LiveUITests LiveChatUITests LiveStyleUITests"
"apple/Sources/CooeeUI/Items.swift" = "LiveUITests LiveChatUITests LiveStyleUITests LiveChatStyleUITests"
"apple/Sources/CooeeFeatures/ChatFeature.swift" = "LiveUITests LiveChatUITests LiveStyleUITests LiveChatStyleUITests"
"apple/Sources/CooeeUI/Trace.swift" = "LiveChatStyleUITests"
"apple/UITests/LiveUITests+Styles.swift" = "LiveChatStyleUITests"
"apple/Sources/CooeeFeatures/ChatOutbox.swift" = "LiveUITests LiveChatUITests"
"apple/Sources/CooeeUI/Copyable.swift" = "LiveChatUITests"
"apple/Sources/CooeeUI/SwipeBack.swift" = "LiveChatUITests"
"apple/Sources/CooeeUI/Block*" = "LiveChatUITests LiveStyleUITests LiveDroverUITests"
"apple/Sources/CooeeFeatures/ChatPlugins.swift" = "LiveChatUITests LiveDroverUITests"
"apple/e2e/cards.mjs" = "LiveChatUITests LiveStyleUITests"
"apple/UITests/LiveScreensUITests.swift" = "LiveChatUITests LiveDroverUITests LiveIconUITests"
"apple/Sources/CooeeUI/Panel*" = "LiveDroverUITests"
"apple/Sources/CooeeUI/PluginSheets.swift" = "LiveDroverUITests"
"apple/Sources/CooeeUI/LaneSheet.swift" = "LiveDroverUITests"
"apple/Sources/CooeeUI/Sprites/*" = "LiveDroverUITests LiveStyleUITests"
"apple/Sources/CooeeFeatures/PluginScreenFeature.swift" = "LiveDroverUITests"
"apple/Sources/CooeeFeatures/AttachFeature.swift" = "LiveDroverUITests"
"apple/UITests/LiveQueueUITests.swift" = "LiveDroverUITests"
"apple/e2e/screens.py" = "LiveDroverUITests"
"apple/Sources/CooeeUI/Workflow.swift" = "LiveWorkflowUITests"
"apple/UITests/LiveWorkflowUITests.swift" = "LiveWorkflowUITests"
# No simulator e2e: docs, design frames, unit tests, the Swift gates and the Mac-only screens (mac-setup covers those).
"apple/*.md" = "none"
"apple/design/*" = "none"
"apple/Tests/*" = "none"
"apple/LaunchAgents/*" = "none"
"apple/UITests/MacSetupUITests.swift" = "none"
"apple/Sources/CooeeUI/Mac*" = "none"
"apple/Sources/CooeeFeatures/MacSetupFeature.swift" = "none"
"tools/anti-slop-swift/*" = "none"
"scripts/apple-check.sh" = "none"
"scripts/apple-coverage.swift" = "none"
"scripts/mac-bins.sh" = "none"
"crates/cooee-core/src/shed.rs" = "none"

# cooee's curated plugin and theme index (docs/plugins.md): Settings › Plugins and `cooee plugin add <name>` list these.
# Each is a git repo with a `cooee-plugin.toml`, pinned to a reviewed commit; adding or moving one is a normal
# reviewed PR. `first_party = true`: the plugin lives with cooee and is improved through an issue, not [improve].
# Anything else is added by its git URL, marked "not reviewed".

[[plugin]]
name = "drover"
url = "https://github.com/jirathip-dev/herdsman"
commit = "90ed1843d054d415591af1e8249595febdbb1d39"
description = "herdsman's queue, events, ask cards and fleets, served by herdsman itself"

# Theme packs (docs/themes.md): `cooee theme add <name>`, `cooee setup` and Settings › look › + theme list these. Each
# is a folder (`path`) of a git repo at a reviewed commit; cooee's own live in packs/themes/ and are first-party.

[[theme]]
name = "farm"
url = "https://github.com/jirathip-dev/cooee"

# The hard cap on non-test lines across crates/*/src and web/src, and apple_cap on apple/ Swift (scripts/line-cap.sh and gatekeeper's core/cap count them alike; the fleet's premerge
# check runs it). Raising it needs the owner's OK in an issue; record each change in docs/cap-history/. The cap is a total for the repo: a lane asks only when its own PR, merged onto current staging, would put the total over it. Trim first, then ask `--kind owner`.
[fleet.cooee] # skip_blank and stop_at_cfg_test make core/cap count only what scripts/line-cap.sh counts
skip_blank = true
stop_at_cfg_test = true
line_cap = 39000
apple_cap = 26000

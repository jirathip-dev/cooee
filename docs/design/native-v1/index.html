<!doctype html>
<!-- #124: the native app's v1 screens, as rendered from the SwiftUI views in apple/ (apple/design/v1/README.md). -->
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>cooee native v1 (#124)</title>
<style>
:root{color-scheme:dark;--bg:#0f1a13;--card:#1d1a12;--edge:#3b3a27;--fg:#ece4cc;--mute:#a3a68a;--l:#ecdba6}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:24px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:15px;color:var(--l);margin:28px 0 10px;text-transform:uppercase;letter-spacing:.06em}
p{color:var(--mute);max-width:820px;margin:0 0 6px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g.w{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
figure{margin:0;background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:8px}
img{width:100%;display:block;border-radius:8px}figcaption{font-size:12px;color:var(--mute);margin-top:6px;overflow-wrap:anywhere}
</style>
<h1>cooee native v1: the screens</h1>
<p>Drawn in SwiftUI in <code>apple/</code>, fed by fixtures shaped like <code>docs/api.md</code>, rendered by <code>swift run shots</code>.
Farm scheme. Glass is drawn as a stand-in in these renders (no Xcode on the design host); see <code>apple/design/v1/README.md</code> for each frame and its decision.</p>
<div id=s></div>
<script>
const D = '../../../apple/design/v1/';
const S = [
  ['iPhone, dark', 'home avatar-menu chat-streaming chat-card chat-cards-more persona'.split(' ').map(f => f + '-dark')],
  ['iPhone, light', 'home avatar-menu chat-streaming chat-card chat-cards-more persona'.split(' ').map(f => f + '-light')],
  ['iPhone first run', 'welcome scan nearby address waiting paired'.split(' ').map(f => 'pair-' + f + '-dark')],
  ['Styles: Terminal and Scene', 'terminal-home-dark terminal-chat-dark terminal-card-dark terminal-persona-dark scene-home-light scene-chat-light scene-card-light'.split(' ').map(f => 'style-' + f)],
  ['Mac: server setup, QR, approve, client', 'welcome folders signins tailscale qr approve'.split(' ').map(f => 'mac-setup-' + f).concat(['mac-connect']), 1],
  ['Mac window: sidebar + chat', ['mac-window-dark', 'mac-window-light'], 1],
];
document.getElementById('s').innerHTML = S.map(([h, fs, w]) => `<h2>${h}</h2><div class="g${w ? ' w' : ''}">${fs.map(f =>
  `<figure><img src="${D}${f}.png" alt="${f}" loading=eager><figcaption>${f}.png</figcaption></figure>`).join('')}</div>`).join('');
</script>

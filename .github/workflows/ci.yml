name: ci
on:
  pull_request:
    branches: [staging]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build tests
        run: cargo test --workspace --locked --no-run
      - name: strace setup
        run: |
          command -v strace || (sudo apt-get update -q && sudo apt-get install -y -q strace)
          ps -o pid,pgid,sid,comm -p $$ $PPID
      - name: focused tests under setsid + strace, 5 rounds
        run: |
          for i in 1 2 3 4 5; do
            setsid strace -f -tt -qq -e trace=kill,tgkill,tkill,pidfd_send_signal,setpgid,setsid -o "st-$i.txt" \
              cargo test --locked -p cooee --test plugin_manager --test screens --test profiles > "t-$i.log" 2>&1
            echo "round $i exit $?"
            grep -E 'test result|FAILED|panicked' "t-$i.log" | tail -6
            echo "-- kill(0|-1|1):"; grep -E ' kill\((0|-1|1),' "st-$i.txt" || echo none
            echo "-- group kills:"; grep -E ' kill\(-[0-9]+,' "st-$i.txt" | head -40
            echo "-- failed setpgid:"; grep -E 'setpgid.*= -1' "st-$i.txt" | head -20
            echo "-- kills that failed:"; grep -E 'kill\(.*= -1' "st-$i.txt" | head -20
          done
      - name: full suite under setsid + strace
        if: always()
        run: |
          setsid strace -f -tt -qq -e trace=kill,tgkill,tkill,pidfd_send_signal,setpgid -o st-all.txt cargo test --workspace --locked > t-all.log 2>&1
          echo "exit $?"
          grep -E 'test result|FAILED|panicked' t-all.log | tail -60
          echo "-- kill(0|-1|1):"; grep -E ' kill\((0|-1|1),' st-all.txt || echo none
          echo "-- group kills:"; grep -E ' kill\(-[0-9]+,' st-all.txt | head -80
          echo "-- kills that failed:"; grep -E 'kill\(.*= -1' st-all.txt | head -40
          echo "-- SIGTERM received:"; grep -E -- '--- SIGTERM' st-all.txt | head -40
      - name: memory
        if: always()
        run: |
          free -m
          sudo dmesg | grep -iE 'oom|killed process' | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.run }}
          path: |
            st-*.txt
            t-*.log

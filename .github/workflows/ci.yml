# #329: synergy's model. `scope` (scripts/ci-scope.sh) picks the legs: a pull request push runs the Linux legs; the
# macOS legs run on the merge-ready run (herdsman's merge_label, on while a review PASS stands at the head), and only
# when the change reaches the Apple surface. A skipped leg still reports its check, under the same name. A staging push
# that a green merge-ready run already tested (same tree) runs nothing again (scripts/ci-reuse.sh); the nightly runs
# every leg on staging and a red one opens or updates one `nightly red:` issue (scripts/ci-nightly.sh).
name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 19 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'merge-ready' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The nightly runs from the default branch (main) but tests staging.
  REF: ${{ github.event_name == 'schedule' && 'staging' || '' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      mac: ${{ steps.scope.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 2
      - name: reuse (a green merge-ready run that tested this tree)
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(scripts/ci-reuse.sh)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "reused: run $run (tree $(git rev-parse 'HEAD^{tree}'))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          CARRIES: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
          REUSED: ${{ steps.reuse.outputs.run }}
        run: |
          set -o pipefail
          scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"

  # #180: a workflow file GitHub can't parse fails here, on the PR, not silently after the merge.
  actionlint:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: actionlint (.github/workflows/**)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # #356: .drover/arch.toml (frozen lists, generated files current, the 800-line cap), by drover's reusable step.
  arch-check:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    uses: jirathip-dev/drover/.github/workflows/arch-check.yml@staging

  # Every gate on the MSRV toolchain (rust-toolchain.toml), on Linux x86_64; macOS runs stable-mac's tests (#388).
  msrv:
    name: msrv (ubuntu-latest)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,topcoat-cli@0.11.0
      # #356: every gate of ci/gates/ (ci/gates.sh), so a new gate adds no line here. #336: on Linux, a session of its
      # own, so a test's group signal can never reach the runner.
      - name: gates (ci/gates/*.sh)
        run: setsid --wait ci/gates.sh
        env:
          GH_TOKEN: ${{ github.token }}

  stable:
    name: stable (ubuntu-latest)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
    steps: &stable
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: ./.github/actions/mac-runner
        if: runner.os == 'macOS'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: ${{ runner.os == 'Linux' && 'setsid --wait' || '' }} cargo test --workspace --locked

  # #365, #565: `vars.MAC_RUNNER_CI` picks the Mac (docs/ci-runners.md): unset, a pull request runs on GitHub-hosted
  # xcode-27 and a push on our own Mac (mini-cooee); on our Mac never for a fork's pull request: that skips it. The
  # check name stays as the staging ruleset requires it. A newer run of the same ref cancels this leg; a
  # run that skips it (another label) gets a group of its own, so it cancels nothing.
  stable-mac:
    name: stable (macos-latest)
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' && needs.scope.outputs.mac == 'true' &&
      (github.event_name != 'pull_request' || vars.MAC_RUNNER_CI != 'self-hosted' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ (vars.MAC_RUNNER_CI == 'self-hosted' || (vars.MAC_RUNNER_CI != 'hosted' && github.event_name != 'pull_request')) && fromJSON('["self-hosted","macOS","ARM64","cooee-mac"]') || 'xcode-27' }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps: *stable

  # #329: a red nightly opens or updates one `nightly red: <check> since <PR>` issue.
  nightly-red:
    needs: [scope, actionlint, arch-check, msrv, stable, stable-mac]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: nightly-red
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/ci-nightly.sh

name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  CARGO_TERM_COLOR: always

jobs:
  # #180: a workflow file GitHub can't parse fails here, on the PR, not silently after the merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (.github/workflows/**)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # Every gate on the MSRV toolchain (rust-toolchain.toml), on Linux x86_64 and macOS arm64.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,topcoat-cli@0.11.0
      - name: fmt (cargo fmt, topcoat fmt)
        run: just fmt
      - name: clippy (pedantic, at most 10 allows)
        run: just clippy
      - name: test (incl. upgrade compatibility and crash injection)
        run: just test
      - name: doc
        run: just doc
      - name: deny (licences, advisories, duplicate versions)
        run: just deny
      - name: line cap (crates/*/src ≤ line_cap; apple/ Swift ≤ apple_cap)
        run: just cap
      - name: dependency direction (cooee-core has no workspace deps)
        run: just deps
      - name: public hygiene (ci/denylist.txt)
        run: just hygiene
      - name: neutral core (no provider named outside crates/cooee-core/src/providers and tests)
        run: just neutral
      - name: theme gate (packs/themes and the starter)
        run: just themes

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --locked

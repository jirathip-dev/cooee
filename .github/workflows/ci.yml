name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  gates:
    uses: jirathip-dev/gatekeeper/.github/workflows/gates.yml@aa132f9eeeee690cf49d8870da76930ca48aa6ac # v1.2.0
    secrets:
      private-names: ${{ secrets.PRIVATE_NAMES }}

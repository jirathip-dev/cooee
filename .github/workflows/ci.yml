# #329: synergy's model. `scope` (scripts/ci-scope.sh) picks the legs: a pull request push runs the Linux legs; the
# macOS legs run on the merge-ready run (herdsman's merge_label, on while a review PASS stands at the head), and only
# when the change reaches the Apple surface. A skipped leg still reports its check, under the same name. A staging push
# that a green merge-ready run already tested (same tree) runs nothing again (scripts/ci-reuse.sh); the nightly runs
# every leg on staging and a red one opens or updates one `nightly red:` issue (scripts/ci-nightly.sh).
name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 19 * * *"
  # #388: ui-stress, the ui suite `repeats` times in a row at a ref; only the ui job runs.
  workflow_dispatch:
    inputs:
      repeats:
        description: how many times the ui suite runs in a row
        default: "20"

env:
  CARGO_TERM_COLOR: always
  # The nightly runs from the default branch (main) but tests staging.
  REF: ${{ github.event_name == 'schedule' && 'staging' || '' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      mac: ${{ steps.scope.outputs.mac }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 2
      - name: reuse (a green merge-ready run that tested this tree)
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(scripts/ci-reuse.sh)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ -n "$run" ]; then
            echo "reused: run $run (tree $(git rev-parse 'HEAD^{tree}'))" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          CARRIES: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
          REUSED: ${{ steps.reuse.outputs.run }}
        run: |
          set -o pipefail
          scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"

  # #180: a workflow file GitHub can't parse fails here, on the PR, not silently after the merge.
  actionlint:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: actionlint (.github/workflows/**)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # Every gate on the MSRV toolchain (rust-toolchain.toml), on Linux x86_64; macOS runs stable-mac's tests (#388).
  msrv:
    name: msrv (ubuntu-latest)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,topcoat-cli@0.11.0
      - name: fmt (cargo fmt, topcoat fmt)
        run: just fmt
      - name: clippy (pedantic, at most 10 allows)
        run: just clippy
      - name: test (incl. upgrade compatibility and crash injection)
        # #336: on Linux, a session of its own, so a test's group signal can never reach the runner.
        run: setsid --wait just test
      - name: doc
        run: just doc
      - name: deny (licences, advisories, duplicate versions)
        run: just deny
      - name: line cap (crates/*/src, web/src and web/ts ≤ line_cap; apple/ Swift ≤ apple_cap)
        run: just cap
      - name: dependency direction (cooee-core has no workspace deps)
        run: just deps
      - name: public hygiene (ci/denylist.txt)
        run: just hygiene
      - name: neutral core (no provider named outside crates/cooee-core/src/providers and tests)
        run: just neutral
      - name: comments (no // or /* */; /// only on public API)
        run: just comments
        env:
          GH_TOKEN: ${{ github.token }}
      - name: theme gate (packs/themes and the starter)
        run: just themes
      - name: CI scripts (scope, reuse, nightly)
        run: just ci-scripts

  stable:
    name: stable (ubuntu-latest)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps: &stable
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: ./.github/actions/mac-runner
        if: runner.environment == 'self-hosted'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: ${{ runner.os == 'Linux' && 'setsid --wait' || '' }} cargo test --workspace --locked

  # #365: the macOS leg runs on our own runners (mini-cooee, air-cooee), never for a fork's pull request: that skips
  # it. The check name stays as the staging ruleset requires it. A newer run of the same ref cancels this leg; a
  # run that skips it (another label) gets a group of its own, so it cancels nothing.
  stable-mac:
    name: stable (macos-latest)
    needs: scope
    if: >-
      needs.scope.outputs.run == 'true' && needs.scope.outputs.mac == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, cooee-mac]
    concurrency:
      group: ci-stable-mac-${{ needs.scope.outputs.mac == 'true' && format('{0}-{1}', github.event_name, github.ref) || github.run_id }}
      cancel-in-progress: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps: *stable

  # web/ts (#49): tsc strict and Biome block; tsc-rs runs the same check as a trial, its result in the log only.
  ts:
    needs: scope
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install (pinned in web/package.json and its lockfile)
        working-directory: web
        run: npm ci
      - name: tsc --noEmit (TypeScript 7, strict)
        working-directory: web
        run: npx tsc -p ts && npx tsc -p ts/tsconfig.sw.json
      - name: biome check (lint and format)
        working-directory: web
        run: npx biome check ts
      - name: tsc-rs (trial, non-blocking)
        working-directory: web
        continue-on-error: true
        run: npx tsc-rs -p ts && npx tsc-rs -p ts/tsconfig.sw.json

  # cargo build strips web/ts itself (web/build.rs, oxc): it must work with no Node on the machine.
  no-node:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: remove Node
        run: |
          while command -v node; do sudo rm -f "$(command -v node)"; done
          ! command -v node
      - name: build
        run: cargo build --locked -p cooee

  # Playwright at 390 and 1440 px with axe accessibility checks; the screenshots are artifacts.
  ui:
    needs: scope
    if: needs.scope.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: build
        run: cargo build --locked -p cooee
      - name: playwright (390, 1440, axe)
        env:
          REPEATS: ${{ inputs.repeats || '1' }}
        run: scripts/ui-stress.sh "$REPEATS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-390
          path: ui-390/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-1440
          path: ui-1440/*.png

  # #329: a red nightly opens or updates one `nightly red: <check> since <PR>` issue.
  nightly-red:
    needs: [scope, actionlint, msrv, stable, stable-mac, ts, no-node, ui]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    concurrency: nightly-red
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/ci-nightly.sh

name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, edited, labeled]

permissions:
  contents: read

jobs:
  gates:
    uses: jirathip-dev/gatekeeper/.github/workflows/gates.yml@49e65a3c0e634088282c783f1f16211a7156fc75 # v1.7.0
    with:
      scope: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') && 'full' || 'light' }}
    secrets:
      private-names: ${{ secrets.PRIVATE_NAMES }}

name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # #180: a workflow file GitHub can't parse fails here, on the PR, not silently after the merge.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (.github/workflows/**)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # Every gate on the MSRV toolchain (rust-toolchain.toml), on Linux x86_64 and (#277: pushes only) macOS arm64.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && (vars.APPLE_RUNNER || 'macos-latest') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,topcoat-cli@0.11.0
      - name: fmt (cargo fmt, topcoat fmt)
        run: just fmt
      - name: clippy (pedantic, at most 10 allows)
        run: just clippy
      - name: test (incl. upgrade compatibility and crash injection)
        run: just test
      - name: doc
        run: just doc
      - name: deny (licences, advisories, duplicate versions)
        run: just deny
      - name: line cap (crates/*/src, web/src and web/ts ≤ line_cap; apple/ Swift ≤ apple_cap)
        run: just cap
      - name: dependency direction (cooee-core has no workspace deps)
        run: just deps
      - name: public hygiene (ci/denylist.txt)
        run: just hygiene
      - name: neutral core (no provider named outside crates/cooee-core/src/providers and tests)
        run: just neutral
      - name: theme gate (packs/themes and the starter)
        run: just themes

  stable:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && (vars.APPLE_RUNNER || 'macos-latest') || matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --locked

  # web/ts (#49): tsc strict and Biome block; tsc-rs runs the same check as a trial, its result in the log only.
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install (pinned in web/package.json and its lockfile)
        working-directory: web
        run: npm ci
      - name: tsc --noEmit (TypeScript 7, strict)
        working-directory: web
        run: npx tsc -p ts && npx tsc -p ts/tsconfig.sw.json
      - name: biome check (lint and format)
        working-directory: web
        run: npx biome check ts
      - name: tsc-rs (trial, non-blocking)
        working-directory: web
        continue-on-error: true
        run: npx tsc-rs -p ts && npx tsc-rs -p ts/tsconfig.sw.json

  # cargo build strips web/ts itself (web/build.rs, oxc): it must work with no Node on the machine.
  no-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: remove Node
        run: |
          while command -v node; do sudo rm -f "$(command -v node)"; done
          ! command -v node
      - name: build
        run: cargo build --locked -p cooee

  # Playwright at 390 and 1440 px with axe accessibility checks; the screenshots are artifacts.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: build
        run: cargo build --locked -p cooee
      - name: playwright (390, 1440, axe)
        working-directory: web/e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-390
          path: ui-390/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-1440
          path: ui-1440/*.png

# #144, #485: archive the app (apple/) for iOS and macOS, one matrix job each in the same run, and upload both to
# TestFlight from CI; no local Xcode, no Ruby/fastlane, no .p12. The Mac build is sandboxed (Cooee-mac.entitlements).
# Apple manages the distribution certificate and profiles (cloud signing through the App Store Connect API key).
# Uploads run only on a merge to `main` (#180). The ASC_* secrets live in the `testflight` environment, which only
# `main` and `staging` may deploy from: pull_request and fork runs can't read them.
# docs/testflight.md has the owner's one-time steps.
# #786: runs on GitHub-hosted xcode-27 (docs/ci-runners.md). #568: the archive is unsigned (ad-hoc, for its
# entitlements) and only the export signs, with Apple's managed distribution certificate, so no run mints a Development certificate. The job's keychain is its own,
# deleted when the job ends. A `workflow_dispatch` without `upload` archives and signs (exports) but uploads nothing.
# #592: a staging push runs that dry run, and the Mac archive must carry every App Store icon size in its ICNS.
name: apple-testflight
on:
  push:
    branches: [main, staging]
    paths: ["apple/**", ".github/workflows/apple-testflight.yml", "scripts/asc-token.swift"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (main only); off archives and signs without uploading
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apple-testflight
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  testflight:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: iOS, asc: IOS, link: ios, device: phone, entitlements: Cooee.entitlements }
          - { platform: macOS, asc: MAC_OS, link: macos, device: Mac, entitlements: Cooee-mac.entitlements }
    name: testflight (${{ matrix.platform }})
    runs-on: xcode-27
    environment: testflight
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      UPLOAD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.upload) }}
    steps:
      # `runner` isn't available in a job-level env, so the temp paths go through $GITHUB_ENV.
      - name: temp paths
        run: |
          { echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"; echo "LOG=$RUNNER_TEMP/xcodebuild.log"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-runner
      - name: the job's own keychain, the default while it runs
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          pass=$(uuidgen)
          security default-keychain -d user | tr -d '" ' > "$RUNNER_TEMP/default-keychain"
          security list-keychains -d user | tr -d '" ' > "$RUNNER_TEMP/keychains"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          read -r -a keychains <<<"$(tr '\n' ' ' < "$RUNNER_TEMP/keychains")"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security default-keychain -d user -s "$keychain"
      - name: App Store Connect (bundle id, team, app, next build number)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"
          token=$(swift scripts/asc-token.swift)
          echo "::add-mask::$token"
          api() { curl -gsS --fail-with-body -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.appstoreconnect.apple.com/v1/$1" "${@:2}"; }
          pbx=apple/Cooee.xcodeproj/project.pbxproj
          bundle=$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \(.*\);/\1/p' "$pbx" | head -1)
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' "$pbx" | head -1)
          seed() { jq -r --arg b "$bundle" '[.data] | flatten | map(select(.attributes.identifier == $b))[0].attributes.seedId // empty'; }
          team=$(api "bundleIds?filter[identifier]=$bundle&fields[bundleIds]=identifier,seedId" | seed)
          if [ -z "$team" ]; then
            body=$(jq -n --arg b "$bundle" '{data: {type: "bundleIds", attributes: {identifier: $b, name: "cooee", platform: "IOS"}}}')
            team=$(api bundleIds -X POST -d "$body" | seed)
            echo "registered the bundle id $bundle"
          fi
          echo "::add-mask::$team"
          if [ "${{ matrix.platform }}" = iOS ]; then
            sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \(.*\);/\1/p' "$pbx" | grep -F "$bundle" | sort -u > "$RUNNER_TEMP/ids"
            while read -r id; do
              rid=$(api "bundleIds?filter[identifier]=$id&fields[bundleIds]=identifier" | jq -r --arg b "$id" '.data | map(select(.attributes.identifier == $b))[0].id // empty')
              if [ -z "$rid" ]; then
                body=$(jq -n --arg b "$id" '{data: {type: "bundleIds", attributes: {identifier: $b, name: ($b | gsub("\\."; " ")), platform: "IOS"}}}')
                rid=$(api bundleIds -X POST -d "$body" | jq -r '.data.id')
                echo "registered the bundle id $id"
              fi
              if ! api "bundleIds/$rid/bundleIdCapabilities" | jq -e '.data | any(.attributes.capabilityType == "APP_GROUPS")' > /dev/null; then
                body=$(jq -n --arg r "$rid" '{data: {type: "bundleIdCapabilities", attributes: {capabilityType: "APP_GROUPS"}, relationships: {bundleId: {data: {type: "bundleIds", id: $r}}}}}')
                api bundleIdCapabilities -X POST -d "$body" > /dev/null
                echo "enabled App Groups on $id"
              fi
            done < "$RUNNER_TEMP/ids"
          fi
          app=$(api "apps?filter[bundleId]=$bundle&fields[apps]=bundleId" | jq -r --arg b "$bundle" '.data | map(select(.attributes.bundleId == $b))[0].id // empty')
          if [ -z "$app" ]; then
            echo "::error::No App Store Connect app for $bundle. Create it once (Apps → + → New App): platforms iOS and macOS (Add Platform on an existing record), name cooee: agent chat, primary language English (U.S.), bundle id $bundle, SKU cooee-ios, user access Full Access. Then re-run this workflow."
            exit 1
          fi
          latest=$(api "builds?filter[app]=$app&filter[preReleaseVersion.platform]=${{ matrix.asc }}&sort=-uploadedDate&limit=1&fields[builds]=version" | jq -r '.data[0].attributes.version // "0"')
          { echo "TEAM=$team"; echo "APP=$app"; echo "VERSION=$version"; echo "BUILD=$((latest + 1))"; } >> "$GITHUB_ENV"
      - name: archive (unsigned)
        working-directory: apple
        run: |
          xcodebuild archive -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination 'generic/platform=${{ matrix.platform }}' \
            -archivePath "$RUNNER_TEMP/Cooee.xcarchive" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD" \
            INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO 2>&1 | tee -a "$LOG"
          app="$RUNNER_TEMP/Cooee.xcarchive/Products/Applications/Cooee.app"
          [ ! -d "$app/PlugIns/CooeeWidgets.appex" ] || codesign --force --sign - --entitlements CooeeWidgets.entitlements "$app/PlugIns/CooeeWidgets.appex"
          codesign --force --sign - --entitlements ${{ matrix.entitlements }} "$app"
      - name: the Mac icon has every App Store size
        if: matrix.platform == 'macOS'
        run: |
          iconutil -c iconset -o "$RUNNER_TEMP/AppIcon.iconset" "$RUNNER_TEMP/Cooee.xcarchive/Products/Applications/Cooee.app/Contents/Resources/AppIcon.icns"
          for s in 16 32 128 256 512; do
            for f in "icon_${s}x${s}.png" "icon_${s}x${s}@2x.png"; do
              [ -f "$RUNNER_TEMP/AppIcon.iconset/$f" ] || { echo "::error::AppIcon.icns lacks $f; App Store export refuses it (apple/Cooee/Assets.xcassets/AppIcon.appiconset)"; exit 1; }
            done
          done
      - name: export (cloud signing; uploads to TestFlight unless a dry run)
        run: |
          destination=$([ "$UPLOAD" = true ] && echo upload || echo export)
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Cooee.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee -a "$LOG"
      - name: summary (dry run)
        if: env.UPLOAD != 'true'
        run: echo "### cooee $VERSION ($BUILD) for ${{ matrix.platform }} archived and signed on $RUNNER_NAME; not uploaded (dry run)" >> "$GITHUB_STEP_SUMMARY"
      - name: summary
        if: env.UPLOAD == 'true'
        run: |
          { echo "### cooee $VERSION ($BUILD) for ${{ matrix.platform }} uploaded to TestFlight"
            echo "Apple processes it for a few minutes, then it shows in TestFlight on the ${{ matrix.device }}."
            echo "[TestFlight in App Store Connect](https://appstoreconnect.apple.com/apps/$APP/testflight/${{ matrix.link }})"; } >> "$GITHUB_STEP_SUMMARY"
      - name: explain a signing failure
        if: failure()
        run: |
          touch "$LOG"
          if grep -qiE 'cloud signing permission|no signing certificate|not have permission' "$LOG"; then
            echo "::error::The App Store Connect API key can't cloud-sign. Give the key the Admin role (App Store Connect → Users and Access → Integrations → Team Keys), or ask for another signing route; this workflow adds no fallback secret."
          fi
          if grep -qiE 'No profiles for|App Group' "$LOG"; then
            echo "::error::A profile lacks the App Group. The API can't make or assign one: in Certificates, Identifiers & Profiles → Identifiers, add the App Group group.com.jirathip.cooee once, then on com.jirathip.cooee and com.jirathip.cooee.widgets tick App Groups → Configure → group.com.jirathip.cooee → Save."
          fi
          if grep -qi 'private key is not installed' "$LOG"; then
            echo "::error::A signing certificate's private key is not in the job's keychain (it is made fresh each run). Only the export may sign, with Apple's managed distribution certificate: revoke the \"Created via API\" Apple Development certificates under Certificates, Identifiers & Profiles, and check that no step signs with a Development identity."
          fi
          # The artifact is not masked like the job log: scrub the key id, issuer id and team before upload.
          for s in "$ASC_KEY_ID" "$ASC_ISSUER_ID" "${TEAM:-}"; do
            [ -n "$s" ] && sed -i '' "s/$s/***/g" "$LOG"
          done
          true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log-${{ matrix.platform }}
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
      - name: remove the key and the job's keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          [ ! -f "$RUNNER_TEMP/sign.keychain-db" ] || security delete-keychain "$RUNNER_TEMP/sign.keychain-db"
          [ ! -s "$RUNNER_TEMP/default-keychain" ] || security default-keychain -d user -s "$(cat "$RUNNER_TEMP/default-keychain")"
          if [ -s "$RUNNER_TEMP/keychains" ]; then
            read -r -a keychains <<<"$(tr '\n' ' ' < "$RUNNER_TEMP/keychains")"
            security list-keychains -d user -s "${keychains[@]}"
          fi

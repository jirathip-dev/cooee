# #124: build the native app (apple/) for iOS and macOS; no signing. #365: every job but `mac-setup` runs on our own
# runners (mini-cooee, air-cooee); no job runs for a fork's pull request (its jobs show skipped), and a newer run of the
# same ref cancels the older one. `mac-setup` stays on GitHub's macos-26 and runs only on staging pushes
# (docs/ci-runners.md says why).
# #330: `e2e` builds the iOS Simulator app once and tests that build; `build` runs on pull request pushes only, since a
# staging push builds the iOS Simulator app in `e2e` and the Mac app in `mac-setup`, both every arch. SwiftPM packages
# and builds are cached per Xcode.
# #147: `apple-quality` runs `just apple-check`, every Swift gate (format, anti-slop, SwiftLint, tests, coverage, Periphery).
# #143: `e2e`: the app in the iOS simulator against a real `cooee serve` (apple/e2e/serve.sh), its
# screens kept as the `simulator-shots` artifact. #142: `mac-setup`: the Mac app's first run on the runner starts cooee
# and shed as login items and shows the QR; the app in the iPhone simulator asks to pair and the Mac approves it;
# the screens kept as the `mac-setup-shots` artifact.
# #328: a pull request push runs only `build`; `apple-quality` and `e2e` run on a staging push and when herdsman labels
# the PR `merge-ready` (fleet `merge_label`: on exactly while a review PASS stands at the head), and merge waits on them.
# #330: a manual run (workflow_dispatch) runs a staging push's jobs at any ref, to time a branch before it merges.
name: apple
on:
  push:
    branches: [staging]
    paths:
      - "scripts/mac-bins.sh"
      - "crates/cooee/src/main.rs"
      - "apple/**"
      - "tools/anti-slop-swift/**"
      - "scripts/apple-check.sh"
      - "scripts/apple-coverage.swift"
      - ".github/workflows/apple.yml"
      - ".github/actions/mac-runner/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "scripts/mac-bins.sh"
      - "crates/cooee/src/main.rs"
      - "apple/**"
      - "tools/anti-slop-swift/**"
      - "scripts/apple-check.sh"
      - "scripts/apple-coverage.swift"
      - ".github/workflows/apple.yml"
      - ".github/actions/mac-runner/**"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.label.name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'labeled'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: &mac [self-hosted, macOS, ARM64, cooee-mac]
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "generic/platform=macOS"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-runner
      - name: xcodebuild
        working-directory: apple
        run: >-
          xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination '${{ matrix.destination }}'
          -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build

  apple-quality:
    if: &full >-
      github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
      && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: *mac
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-runner
      - id: xcode
        run: echo "v=$(xcodebuild -version | tr -d ' \n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            tools/anti-slop-swift/.build
            apple/.build
          key: apple-quality-${{ steps.xcode.outputs.v }}-${{ hashFiles('apple/Package.resolved', 'tools/anti-slop-swift/Package.resolved') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: just apple-check
        env:
          GH_TOKEN: ${{ github.token }}
          COOEE_RENDERED: ${{ runner.temp }}/rendered
        run: mkdir -p "$COOEE_RENDERED" && just apple-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-frames
          path: ${{ runner.temp }}/rendered

  e2e:
    if: *full
    runs-on: *mac
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-runner
      - name: the simulator, created and booted in the background
        run: |
          sim=$(xcrun simctl create "cooee-e2e-$GITHUB_RUN_ID" "iPhone 17")
          echo "SIM=$sim" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$sim" -b >"$RUNNER_TEMP/boot.log" 2>&1 &
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - id: xcode
        run: echo "v=$(xcodebuild -version | tr -d ' \n')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            apple/.build
            ${{ runner.temp }}/packages
            ${{ runner.temp }}/derived
          key: apple-e2e-${{ steps.xcode.outputs.v }}-${{ hashFiles('apple/Package.resolved') }}
      - name: cooee serve (fake agent)
        run: |
          PORT=4100 PAIR_LINK="$RUNNER_TEMP/pair" apple/e2e/serve.sh >"$RUNNER_TEMP/serve.log" 2>&1 &
          serve=$!
          echo "SERVE=$serve" >> "$GITHUB_ENV"
          until [ -s "$RUNNER_TEMP/pair" ]; do
            kill -0 "$serve" 2>/dev/null || { cat "$RUNNER_TEMP/serve.log"; exit 1; }
            sleep 2
          done
          cat "$RUNNER_TEMP/serve.log"
      - name: the client against it (swift test)
        working-directory: apple
        run: COOEE_PAIR_LINK="$(cat "$RUNNER_TEMP/pair")" swift test --filter LiveTests
      - name: build for testing (the app in the simulator, every arch)
        working-directory: apple
        run: >-
          xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/derived" build-for-testing
      # Once per appearance, set with simctl (the test's own XCUIDevice.appearance left this simulator light); each
      # run pairs afresh, so the keychain is emptied first. The app builds before any code is minted: a code lives 10 min.
      - name: the app in the simulator
        run: |
          xcrun simctl bootstatus "$SIM" -b >>"$RUNNER_TEMP/boot.log" 2>&1 || { cat "$RUNNER_TEMP/boot.log"; exit 1; }
          for look in dark light; do
            xcrun simctl ui "$SIM" appearance "$look"
            xcrun simctl keychain "$SIM" reset
            link=$(sh -c "$(cat "$RUNNER_TEMP/pair.again")" | sed -n 's/^link  //p')
            TEST_RUNNER_COOEE_LOOK="$look" TEST_RUNNER_COOEE_PAIR_LINK="$link" xcodebuild test-without-building \
              -xctestrun "$(ls "$RUNNER_TEMP"/derived/Build/Products/*.xctestrun)" -destination "id=$SIM" \
              -resultBundlePath "$RUNNER_TEMP/e2e-$look.xcresult"
          done
      # #139: the personas the simulator made and edited, read back from the server, and a client round trip.
      - name: the simulator's personas on the server (swift test)
        working-directory: apple
        run: |
          link=$(sh -c "$(cat "$RUNNER_TEMP/pair.again")" | sed -n 's/^link  //p')
          COOEE_PERSONA_LINK="$link" COOEE_SIM_LOOKS="dark light" swift test --filter LivePersonaTests
      - name: screenshots
        if: always()
        run: |
          mkdir -p simulator-shots
          for look in dark light; do
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/e2e-$look.xcresult" \
              --output-path "simulator-shots/$look" || true
          done
          cp "$RUNNER_TEMP/serve.log" simulator-shots/ || true
          ls simulator-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-shots
          path: simulator-shots
      - name: stop the server, delete the simulator
        if: always()
        run: |
          [ -z "${SERVE:-}" ] || kill "$SERVE" 2>/dev/null || true
          [ -z "${SIM:-}" ] || xcrun simctl delete "$SIM"

  mac-setup:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SHOTS: ${{ github.workspace }}/mac-setup-shots
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - id: image
        run: echo "v=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: shed
        run: echo "rev=$(sed -n 's/^ *"\([0-9a-f]\{40\}\)",$/\1/p' crates/cooee/src/main.rs | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/bin/shed-root
            ${{ runner.temp }}/packages
            ${{ runner.temp }}/mac
            ${{ runner.temp }}/ios
          key: apple-mac-setup-${{ steps.image.outputs.v }}-${{ steps.shed.outputs.rev }}-${{ hashFiles('apple/Package.resolved') }}
      - name: cooee and shed for the app
        run: scripts/mac-bins.sh "$RUNNER_TEMP/bin"
      - name: build for testing (the Mac app with them inside, and the app in the simulator)
        working-directory: apple
        run: |
          sim=$(xcrun simctl create cooee-ask "iPhone 17")
          echo "SIM=$sim" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$sim" -b >"$RUNNER_TEMP/boot.log" 2>&1 &
          xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/mac" \
            COOEE_BIN_DIR="$RUNNER_TEMP/bin" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build-for-testing
          xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination "id=$sim" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/ios" build-for-testing
      # The Mac test sets the Mac up and waits on its QR screen; once its pairing code is open (devices.json), the
      # phone asks by address, and the Mac test approves it.
      - name: the Mac sets itself up; the phone asks and the Mac approves it
        working-directory: apple
        run: |
          sudo automationmodetool enable-automationmode-without-authentication || true
          TEST_RUNNER_COOEE_MAC_SETUP=1 xcodebuild -project Cooee.xcodeproj -scheme Cooee -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/mac" \
            -only-testing:CooeeAppUITests/MacSetupUITests \
            -resultBundlePath "$RUNNER_TEMP/mac-setup.xcresult" test-without-building >"$RUNNER_TEMP/mac-test.log" 2>&1 &
          mac=$!
          devices="$HOME/.local/share/cooee/cooee/devices.json"
          waited=0
          until grep -q '"code": \[' "$devices" 2>/dev/null; do
            if ! kill -0 "$mac" 2>/dev/null || [ "$waited" -ge 1200 ]; then
              tail -120 "$RUNNER_TEMP/mac-test.log"
              exit 1
            fi
            sleep 5
            waited=$((waited + 5))
          done
          curl -sS -o /dev/null -w 'cooee answers %{http_code}\n' http://127.0.0.1:4747/pair
          xcrun simctl bootstatus "$SIM" -b
          TEST_RUNNER_COOEE_ASK_ADDRESS=http://127.0.0.1:4747 xcodebuild -project Cooee.xcodeproj -scheme Cooee \
            -destination "id=$SIM" -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" -derivedDataPath "$RUNNER_TEMP/ios" \
            -only-testing:CooeeAppUITests/LiveUITests/testAsksAndTheMacApprovesIt \
            -resultBundlePath "$RUNNER_TEMP/phone-ask.xcresult" test-without-building
          status=0
          wait "$mac" || status=$?
          tail -40 "$RUNNER_TEMP/mac-test.log"
          exit "$status"
      - name: what the Mac ran (on failure)
        if: failure()
        run: |
          pgrep -lf 'cooee|shed|zsh|security' || true
          for f in "$HOME/.config/cooee/cooee/config.toml" "$HOME/.local/share/cooee/cooee/devices.json"; do
            echo "== $f"; cat "$f" || true
          done
          ls -la "$HOME/.local/share/cooee/cooee" || true
          for label in serve shed; do launchctl print "gui/$(id -u)/com.jirathip.cooee.$label" | head -25 || true; done
          app=$(find "$RUNNER_TEMP/mac/Build/Products" -maxdepth 2 -name Cooee.app | head -1)
          ls -la "$app/Contents/Helpers" "$app/Contents/Library/LaunchAgents" || true
          perl -e "alarm 60; exec @ARGV" "$app/Contents/Helpers/cooee" pair </dev/null; echo "cooee pair exit $?"
      - name: screenshots
        if: always()
        run: |
          mkdir -p "$SHOTS"
          for run in mac-setup phone-ask; do
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$run.xcresult" --output-path "$SHOTS/$run" || true
          done
          cp "$RUNNER_TEMP/mac-test.log" "$SHOTS/" || true
          ls -R "$SHOTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-setup-shots
          path: mac-setup-shots

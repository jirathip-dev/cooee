# #124: build the native app (apple/) for iOS and macOS; no signing. #147: `just apple-check`, every Swift gate (format,
# anti-slop, SwiftLint, tests, coverage, Periphery). #143: the app in the iOS simulator against a real `cooee serve`
# (apple/e2e/run.sh), its screens kept as the `simulator-shots` artifact. #277: all three in one `apple` job, so a PR
# takes one macOS runner here; a newer push to a PR cancels its older run. #365, #565: `vars.MAC_RUNNER_APPLE` picks
# the Mac (docs/ci-runners.md): unset, a pull request runs on GitHub-hosted xcode-27 and a push on our own Mac
# (mini-cooee); on our Mac never for a fork's pull request (it shows skipped). #484: the Mac app is a client only; the
# e2e's phone asks the CLI server and `cooee pair approve` answers it. #328: on a pull request push `apple` runs only the
# builds; `just apple-check` and the e2e steps run on a staging push and when herdsman labels the PR `merge-ready`
# (fleet `merge_label`: on exactly while a review PASS stands at the head), and merge waits on that run.
# The e2e steps build the app once for their simulator and test that build; a staging push or manual run skips the
# pull request builds. Every build names a concrete destination: a generic one builds every architecture. #430: on a
# pull request `scope` (scripts/e2e-scope.sh) picks the e2e tests apple/e2e/map.toml pairs with the changed paths; a
# change that reaches no Apple surface gets an `apple` that passes on ubuntu-latest, "no screens touched".
# #440: the e2e runs nightly on staging's head (and on a manual run) whatever `vars.E2E` says; PRs and staging pushes
# follow `vars.E2E` (#436: `off` skips the e2e steps). #487: the schedule and manual runs add apple-check's tidy-code
# gates (`--nightly`: Features coverage, swiftlint analyze, Periphery); a red nightly opens or updates the one
# `nightly red:` issue (scripts/ci-nightly.sh), naming the failed gate. #475: a pull request push takes a Mac only on the merge-ready
# run (or while the PR carries merge-ready); any other push runs `apple` on ubuntu-latest, "waits for merge-ready".
name: apple
on:
  push:
    branches: [staging]
    paths:
      - "crates/cooee/src/main.rs"
      - "crates/cooee-core/src/shed.rs"
      - "apple/**"
      - "tools/anti-slop-swift/**"
      - "scripts/apple-check.sh"
      - "scripts/apple-coverage.swift"
      - ".github/workflows/apple.yml"
      - ".github/actions/mac-runner/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "41 18 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'merge-ready' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: >-
      github.event_name != 'pull_request' || ((github.event.pull_request.head.repo.full_name == github.repository
      || vars.MAC_RUNNER_APPLE != 'self-hosted') && (github.event.action != 'labeled' || github.event.label.name == 'merge-ready'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.scope.outputs.mac }}
      full: ${{ steps.scope.outputs.full }}
      e2e: ${{ steps.scope.outputs.e2e }}
      only: ${{ steps.scope.outputs.only }}
      persona: ${{ steps.scope.outputs.persona }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'schedule' && 'staging' || '' }}
      - name: scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          CARRIES: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
        run: |
          set -o pipefail
          scripts/e2e-scope.sh | tee -a "$GITHUB_OUTPUT"

  apple:
    needs: scope
    runs-on: >-
      ${{ needs.scope.outputs.mac == 'true' && ((vars.MAC_RUNNER_APPLE == 'self-hosted' || (vars.MAC_RUNNER_APPLE != 'hosted' && github.event_name != 'pull_request'))
      && fromJSON('["self-hosted","macOS","ARM64","cooee-mac"]') || 'xcode-27') || 'ubuntu-latest' }}
    timeout-minutes: 120
    outputs:
      gate: ${{ steps.check.outputs.gate }}
    env:
      MAC: ${{ needs.scope.outputs.mac }}
      FULL: ${{ needs.scope.outputs.full }}
      E2E: >-
        ${{ needs.scope.outputs.e2e == 'true' && (github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch' || vars.E2E != 'off') }}
      ONLY: ${{ needs.scope.outputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'schedule' && 'staging' || '' }}
      - uses: ./.github/actions/mac-runner
        if: env.MAC == 'true'
      - name: which e2e tests, and why
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          CARRIES: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
        run: SUMMARY="$GITHUB_STEP_SUMMARY" scripts/e2e-scope.sh && cat "$GITHUB_STEP_SUMMARY"
      - uses: taiki-e/install-action@v2
        if: env.MAC == 'true'
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@1.99.1
        if: env.MAC == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.MAC == 'true'
      - name: xcodebuild (iOS Simulator, macOS)
        if: github.event_name == 'pull_request' && env.MAC == 'true'
        working-directory: apple
        run: |
          destinations=("generic/platform=macOS")
          [ "$E2E" = true ] || destinations+=("generic/platform=iOS Simulator")
          for destination in "${destinations[@]}"; do
            xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination "$destination" \
              -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
          done
      - name: just apple-check
        id: check
        if: env.FULL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COOEE_RENDERED: ${{ runner.temp }}/rendered
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p "$COOEE_RENDERED"
          if [ "$NIGHTLY" = true ]; then just apple-check --nightly; else just apple-check; fi
      - uses: actions/upload-artifact@v4
        if: always() && env.FULL == 'true'
        with:
          name: rendered-frames
          path: ${{ runner.temp }}/rendered
      - name: e2e off
        if: vars.E2E == 'off'
        run: echo "e2e off (vars.E2E=off)" >> "$GITHUB_STEP_SUMMARY"
      # #356: the server, the simulator, every step of apple/e2e/steps/, the screens and the teardown (apple/e2e/run.sh).
      - name: the app and the client against cooee serve (apple/e2e/run.sh)
        if: env.E2E == 'true'
        env:
          E2E_DIR: ${{ runner.temp }}
          PERSONA: ${{ needs.scope.outputs.persona }}
        run: apple/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always() && env.E2E == 'true'
        with:
          name: simulator-shots
          path: simulator-shots

  nightly-red:
    needs: apple
    if: always() && github.event_name == 'schedule' && needs.apple.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency: nightly-red
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: apple.yml
          CHECK: ${{ needs.apple.outputs.gate && format('apple-check {0}', needs.apple.outputs.gate) || '' }}
        run: scripts/ci-nightly.sh

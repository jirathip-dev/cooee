# #124: build the native app (apple/) for iOS and macOS; no signing. #147: `just apple-check`, every Swift gate (format,
# anti-slop, SwiftLint, tests, coverage, Periphery). #143: the app in the iOS simulator against a real `cooee serve`
# (apple/e2e/serve.sh), its screens kept as the `simulator-shots` artifact. #277: all three in one `apple` job, so a PR
# takes one macOS runner here; a newer push to a PR cancels its older run. #365: `apple` runs on our own runners
# (mini-cooee, air-cooee), never for a fork's pull request (it shows skipped). #142: `mac-setup` (staging pushes and
# workflow_dispatch only, on GitHub's macos-26, docs/ci-runners.md says why): the Mac app's first run on the runner
# starts cooee and shed as login items and shows the QR; the app in the iPhone simulator asks to pair and the Mac
# approves it; the screens kept as the `mac-setup-shots` artifact. #328: on a pull request push `apple` runs only the
# builds; `just apple-check` and the e2e steps run on a staging push and when herdsman labels the PR `merge-ready`
# (fleet `merge_label`: on exactly while a review PASS stands at the head), and merge waits on that run.
name: apple
on:
  push:
    branches: [staging]
    paths:
      - "scripts/mac-bins.sh"
      - "crates/cooee/src/main.rs"
      - "apple/**"
      - "tools/anti-slop-swift/**"
      - "scripts/apple-check.sh"
      - "scripts/apple-coverage.swift"
      - ".github/workflows/apple.yml"
      - ".github/actions/mac-runner/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "scripts/mac-bins.sh"
      - "crates/cooee/src/main.rs"
      - "apple/**"
      - "tools/anti-slop-swift/**"
      - "scripts/apple-check.sh"
      - "scripts/apple-coverage.swift"
      - ".github/workflows/apple.yml"
      - ".github/actions/mac-runner/**"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'merge-ready' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apple:
    if: >-
      github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'labeled' || github.event.label.name == 'merge-ready'))
    runs-on: [self-hosted, macOS, ARM64, cooee-mac]
    timeout-minutes: 120
    env:
      FULL: ${{ github.event_name != 'pull_request' || github.event.action == 'labeled' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-runner
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: xcodebuild (iOS Simulator, macOS)
        working-directory: apple
        run: |
          for destination in "generic/platform=iOS Simulator" "generic/platform=macOS"; do
            xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination "$destination" \
              -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
          done
      - name: just apple-check
        if: env.FULL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COOEE_RENDERED: ${{ runner.temp }}/rendered
        run: mkdir -p "$COOEE_RENDERED" && just apple-check
      - uses: actions/upload-artifact@v4
        if: always() && env.FULL == 'true'
        with:
          name: rendered-frames
          path: ${{ runner.temp }}/rendered
      - name: cooee serve (fake agent)
        if: env.FULL == 'true'
        run: |
          PORT=4100 PAIR_LINK="$RUNNER_TEMP/pair" apple/e2e/serve.sh >"$RUNNER_TEMP/serve.log" 2>&1 &
          serve=$!
          echo "SERVE=$serve" >> "$GITHUB_ENV"
          until [ -s "$RUNNER_TEMP/pair" ]; do
            kill -0 "$serve" 2>/dev/null || { cat "$RUNNER_TEMP/serve.log"; exit 1; }
            sleep 2
          done
          cat "$RUNNER_TEMP/serve.log"
      - name: the client against it (swift test)
        if: env.FULL == 'true'
        working-directory: apple
        run: COOEE_PAIR_LINK="$(cat "$RUNNER_TEMP/pair")" swift test --filter LiveTests
      # Once per appearance, set with simctl (the test's own XCUIDevice.appearance left this simulator light); each
      # run pairs afresh, so the keychain is emptied first. The app builds before any code is minted: a code lives 10 min.
      - name: the app in the simulator
        if: env.FULL == 'true'
        working-directory: apple
        run: |
          sim=$(xcrun simctl create "cooee-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "iPhone 17")
          echo "SIM=$sim" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$sim" -b
          build=(xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination "id=$sim" \
            -derivedDataPath "$RUNNER_TEMP/derived")
          "${build[@]}" build-for-testing
          for look in dark light; do
            xcrun simctl ui "$sim" appearance "$look"
            xcrun simctl keychain "$sim" reset
            link=$(sh -c "$(cat "$RUNNER_TEMP/pair.again")" | sed -n 's/^link  //p')
            TEST_RUNNER_COOEE_LOOK="$look" TEST_RUNNER_COOEE_PAIR_LINK="$link" "${build[@]}" \
              -resultBundlePath "$RUNNER_TEMP/e2e-$look.xcresult" test-without-building
          done
      # #139: the personas the simulator made and edited, read back from the server, and a client round trip.
      - name: the simulator's personas on the server (swift test)
        if: env.FULL == 'true'
        working-directory: apple
        run: |
          link=$(sh -c "$(cat "$RUNNER_TEMP/pair.again")" | sed -n 's/^link  //p')
          COOEE_PERSONA_LINK="$link" COOEE_SIM_LOOKS="dark light" swift test --filter LivePersonaTests
      - name: screenshots
        if: always() && env.FULL == 'true'
        run: |
          mkdir -p simulator-shots
          for look in dark light; do
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/e2e-$look.xcresult" \
              --output-path "simulator-shots/$look" || true
          done
          cp "$RUNNER_TEMP/serve.log" simulator-shots/ || true
          ls simulator-shots
      - uses: actions/upload-artifact@v4
        if: always() && env.FULL == 'true'
        with:
          name: simulator-shots
          path: simulator-shots
      - name: stop the server, delete the simulator
        if: always()
        run: |
          [ -z "${SERVE:-}" ] || kill "$SERVE" 2>/dev/null || true
          [ -z "${SIM:-}" ] || xcrun simctl delete "$SIM"

  mac-setup:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SHOTS: ${{ github.workspace }}/mac-setup-shots
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: cooee and shed for the app
        run: scripts/mac-bins.sh "$RUNNER_TEMP/bin"
      # #333: the Mac app is built twice, versions 1 and 2, with a throwaway Sparkle key and a local appcast.
      - name: build for testing (the Mac app with them inside, and the app in the simulator)
        working-directory: apple
        run: |
          key=$(openssl rand -base64 32)
          echo "UPDATE_KEY=$key" >> "$GITHUB_ENV"
          public=$(SPARKLE_ED_KEY=$key swift ../scripts/sparkle-public-key.swift)
          for build in 1:mac 2:mac2; do
            xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/${build#*:}" COOEE_BIN_DIR="$RUNNER_TEMP/bin" CODE_SIGN_IDENTITY=- \
              CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CURRENT_PROJECT_VERSION="${build%:*}" \
              SPARKLE_PUBLIC_KEY="$public" SPARKLE_FEED_URL=http://127.0.0.1:8787/appcast.xml build-for-testing
          done
          sim=$(xcrun simctl create "cooee-ask-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "iPhone 17")
          echo "SIM=$sim" >> "$GITHUB_ENV"
          xcodebuild -skipMacroValidation -project Cooee.xcodeproj -scheme Cooee -destination "id=$sim" \
            -derivedDataPath "$RUNNER_TEMP/ios" build-for-testing
      # The Mac test sets the Mac up and waits on its QR screen; once its pairing code is open (devices.json), the
      # phone asks by address, and the Mac test approves it.
      - name: the Mac sets itself up; the phone asks and the Mac approves it
        working-directory: apple
        run: |
          sudo automationmodetool enable-automationmode-without-authentication || true
          TEST_RUNNER_COOEE_MAC_SETUP=1 xcodebuild -project Cooee.xcodeproj -scheme Cooee -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/mac" -only-testing:CooeeAppUITests/MacSetupUITests \
            -resultBundlePath "$RUNNER_TEMP/mac-setup.xcresult" test-without-building >"$RUNNER_TEMP/mac-test.log" 2>&1 &
          mac=$!
          devices="$HOME/.local/share/cooee/cooee/devices.json"
          waited=0
          until grep -q '"code": \[' "$devices" 2>/dev/null; do
            if ! kill -0 "$mac" 2>/dev/null || [ "$waited" -ge 1200 ]; then
              tail -120 "$RUNNER_TEMP/mac-test.log"
              exit 1
            fi
            sleep 5
            waited=$((waited + 5))
          done
          curl -sS -o /dev/null -w 'cooee answers %{http_code}\n' http://127.0.0.1:4747/pair
          xcrun simctl bootstatus "$SIM" -b
          TEST_RUNNER_COOEE_ASK_ADDRESS=http://127.0.0.1:4747 xcodebuild -project Cooee.xcodeproj -scheme Cooee \
            -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/ios" \
            -only-testing:CooeeAppUITests/LiveUITests/testAsksAndTheMacApprovesIt \
            -resultBundlePath "$RUNNER_TEMP/phone-ask.xcresult" test-without-building
          status=0
          wait "$mac" || status=$?
          tail -40 "$RUNNER_TEMP/mac-test.log"
          exit "$status"
      # #333: version 1 finds version 2 on a local appcast (EdDSA-signed, with a delta), installs it on quit and restarts
      # cooee and shed; port 4747 answers and the phone is still paired.
      - name: the Mac updates itself through a local appcast; the phone stays paired
        working-directory: apple
        run: |
          app="$RUNNER_TEMP/mac/Build/Products/Debug/Cooee.app"
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed/1" "$feed/2"
          ditto "$app" "$feed/1/Cooee.app"
          ditto "$RUNNER_TEMP/mac2/Build/Products/Debug/Cooee.app" "$feed/2/Cooee.app"
          for version in 1 2; do
            hdiutil create -quiet -volname cooee -srcfolder "$feed/$version" -format UDZO "$feed/Cooee-$version.dmg"
            rm -rf "${feed:?}/$version"
          done
          printf '%s' "$UPDATE_KEY" | "$RUNNER_TEMP/mac/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            --ed-key-file - --download-url-prefix http://127.0.0.1:8787/ "$feed"
          cat "$feed/appcast.xml"
          python3 -m http.server 8787 --bind 127.0.0.1 -d "$feed" >"$RUNNER_TEMP/feed.log" 2>&1 &
          echo "FEED=$!" >> "$GITHUB_ENV"
          pid() { launchctl print "gui/$(id -u)/com.jirathip.cooee.$1" | awk '$1 == "pid" { print $3 }'; }
          serve=$(pid serve)
          shed=$(pid shed)
          defaults write com.jirathip.cooee SUHasLaunchedBefore -bool YES
          defaults write com.jirathip.cooee SULastCheckTime -date "2000-01-01 00:00:00 +0000"
          log="$HOME/Library/Logs/cooee-update.log"
          open "$app"
          waited=0
          until grep -q waiting "$log" 2>/dev/null; do
            [ "$waited" -lt 300 ] || { echo "no update staged"; cat "$RUNNER_TEMP/feed.log"; exit 1; }
            sleep 5
            waited=$((waited + 5))
          done
          osascript -e 'tell application id "com.jirathip.cooee" to quit'
          waited=0
          until grep -q "cooee answers on 4747" "$log" 2>/dev/null; do
            [ "$waited" -lt 300 ] || { cat "$log"; exit 1; }
            sleep 5
            waited=$((waited + 5))
          done
          cat "$log" "$RUNNER_TEMP/feed.log"
          echo "login item pids: cooee $serve -> $(pid serve), shed $shed -> $(pid shed)"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          [ "$version" = 2 ] || { echo "the app is version $version, not 2"; exit 1; }
          [ -n "$(pid serve)" ] && [ "$(pid serve)" != "$serve" ] || { echo "cooee did not restart"; exit 1; }
          [ -n "$(pid shed)" ] && [ "$(pid shed)" != "$shed" ] || { echo "shed did not restart"; exit 1; }
          curl -sSf -o /dev/null -w 'cooee answers %{http_code}\n' http://127.0.0.1:4747/pair
          TEST_RUNNER_COOEE_AFTER_UPDATE=1 xcodebuild -project Cooee.xcodeproj -scheme Cooee -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/ios" -only-testing:CooeeAppUITests/LiveUITests/testStaysPairedAfterTheMacUpdates \
            -resultBundlePath "$RUNNER_TEMP/after-update.xcresult" test-without-building
      - name: what the Mac ran (on failure)
        if: failure()
        run: |
          pgrep -lf 'cooee|shed|zsh|security' || true
          for f in "$HOME/.config/cooee/cooee/config.toml" "$HOME/.local/share/cooee/cooee/devices.json"; do
            echo "== $f"; cat "$f" || true
          done
          ls -la "$HOME/.local/share/cooee/cooee" || true
          for label in serve shed; do launchctl print "gui/$(id -u)/com.jirathip.cooee.$label" | head -25 || true; done
          app=$(find "$RUNNER_TEMP/mac/Build/Products" -maxdepth 2 -name Cooee.app | head -1)
          ls -la "$app/Contents/Helpers" "$app/Contents/Library/LaunchAgents" || true
          perl -e "alarm 60; exec @ARGV" "$app/Contents/Helpers/cooee" pair </dev/null; echo "cooee pair exit $?"
      - name: screenshots
        if: always()
        run: |
          mkdir -p "$SHOTS"
          for run in mac-setup phone-ask after-update; do
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$run.xcresult" --output-path "$SHOTS/$run" || true
          done
          cp "$RUNNER_TEMP/mac-test.log" "$SHOTS/" || true
          ls -R "$SHOTS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-setup-shots
          path: mac-setup-shots
      - name: delete the simulator, stop the appcast server
        if: always()
        run: |
          [ -z "${FEED:-}" ] || kill "$FEED" 2>/dev/null || true
          [ -z "${SIM:-}" ] || { xcrun simctl shutdown "$SIM" || true; xcrun simctl delete "$SIM"; }

# #124: build the native app (apple/) for iOS and macOS on a GitHub-hosted macOS runner (free on this public repo); no
# signing. #143: the API client's unit tests, and `e2e`: the app in the iOS simulator against a real `cooee serve`
# (apple/e2e/serve.sh), its screens kept as the `simulator-shots` artifact.
name: apple
on:
  push:
    branches: [staging]
    paths: ["apple/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/apple.yml"]
jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "generic/platform=macOS"]
    steps:
      - uses: actions/checkout@v4
      - name: xcodebuild
        working-directory: apple
        run: >-
          xcodebuild -project Cooee.xcodeproj -scheme Cooee -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO build
      - name: unit tests (swift test)
        if: matrix.destination == 'generic/platform=macOS'
        working-directory: apple
        run: swift test
      - name: renders (swift run shots)
        if: matrix.destination == 'generic/platform=macOS'
        working-directory: apple
        run: swift run shots /tmp/shots && ls /tmp/shots

  e2e:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: cooee serve (fake agent)
        run: |
          PORT=4100 PAIR_LINK="$RUNNER_TEMP/pair" apple/e2e/serve.sh >"$RUNNER_TEMP/serve.log" 2>&1 &
          serve=$!
          until curl -s -o /dev/null http://127.0.0.1:4100/pair; do
            kill -0 "$serve" 2>/dev/null || { cat "$RUNNER_TEMP/serve.log"; exit 1; }
            sleep 2
          done
          cat "$RUNNER_TEMP/serve.log"
      - name: the client against it (swift test)
        working-directory: apple
        run: COOEE_PAIR_LINK="$(cat "$RUNNER_TEMP/pair")" swift test --filter LiveTests
      # Once per appearance, set with simctl (the test's own XCUIDevice.appearance left this simulator light); each
      # run pairs afresh, so the keychain is emptied first.
      - name: the app in the simulator
        working-directory: apple
        run: |
          sim=$(xcrun simctl create cooee-e2e "iPhone 17")
          xcrun simctl bootstatus "$sim" -b
          for look in dark light; do
            xcrun simctl ui "$sim" appearance "$look"
            xcrun simctl keychain "$sim" reset
            link=$(sh -c "$(cat "$RUNNER_TEMP/pair.again")" | sed -n 's/^link  //p')
            TEST_RUNNER_COOEE_LOOK="$look" TEST_RUNNER_COOEE_PAIR_LINK="$link" xcodebuild -project Cooee.xcodeproj \
              -scheme Cooee -destination "id=$sim" -resultBundlePath "$RUNNER_TEMP/e2e-$look.xcresult" test
          done
      - name: screenshots
        if: always()
        run: |
          mkdir -p simulator-shots
          for look in dark light; do
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/e2e-$look.xcresult" \
              --output-path "simulator-shots/$look" || true
          done
          cp "$RUNNER_TEMP/serve.log" simulator-shots/ || true
          ls simulator-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-shots
          path: simulator-shots

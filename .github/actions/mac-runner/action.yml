# #365, #565, #786: the first step of every macOS job, on GitHub-hosted xcode-27 (docs/ci-runners.md). Xcode is the one
# at an explicit path, its version in the log and the summary. #486: the repo pins one Xcode (`pin` below); a runner
# with another fails here. The build folders (APPLE_DERIVED, APPLE_PACKAGES) sit in RUNNER_TEMP, so every job builds cold.
name: mac-runner
description: A macOS job's pinned Xcode and its build folders
runs:
  using: composite
  steps:
    - name: Xcode and build folders
      shell: bash
      run: |
        pin=27.2
        xcode=/Applications/Xcode_27.2.app/Contents/Developer
        version=$(DEVELOPER_DIR=$xcode xcodebuild -version | tr '\n' ' ')
        echo "### $RUNNER_NAME: $version" | tee -a "$GITHUB_STEP_SUMMARY"
        [ "$(DEVELOPER_DIR=$xcode xcodebuild -version | sed -n 's/^Xcode //p')" = "$pin" ] || {
          echo "::error::$RUNNER_NAME has $version; the repo pins Xcode $pin (.github/actions/mac-runner)"
          echo "$RUNNER_NAME has $version; the repo pins Xcode $pin" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        mkdir -p "$RUNNER_TEMP/apple/derived" "$RUNNER_TEMP/apple/packages"
        { echo "APPLE_DERIVED=$RUNNER_TEMP/apple/derived"
          echo "APPLE_PACKAGES=$RUNNER_TEMP/apple/packages"
          echo "DEVELOPER_DIR=$xcode"; } >> "$GITHUB_ENV"

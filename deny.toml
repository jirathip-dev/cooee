[graph]
# The platforms CI builds; Windows-only crates stay out of the checks.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Web push needs p256 0.14 (0.13's crypto-bigint 0.5 has RUSTSEC-2026-0387), which is on RustCrypto's digest 0.11
# line while Topcoat (tungstenite's sha1 and rand) is still on digest 0.10 and rand_core 0.9: both lines stay until
# Topcoat moves.
skip = [
    { crate = "block-buffer@0.10.4", reason = "Topcoat's sha1; p256 0.14 / sha2 0.11 use 0.12" },
    { crate = "cpufeatures@0.2.17", reason = "Topcoat's sha1 and aes 0.8; sha2 0.11 uses 0.3" },
    { crate = "crypto-common@0.1.7", reason = "Topcoat's sha1 and aes-gcm 0.10; sha2 0.11 uses 0.2" },
    { crate = "digest@0.10.7", reason = "Topcoat's sha1; sha2 0.11 uses 0.11" },
    { crate = "rand_core@0.9.5", reason = "Topcoat's tungstenite; p256 0.14 uses 0.10 (traits only)" },
    { crate = "base64@0.23.1", reason = "oxc_transformer's, web/build.rs only (#49); the workspace pins 0.22" },
    { crate = "syn@3.0.9", reason = "oxc's diagnostics (icu via textwrap), web/build.rs only (#49); Topcoat's macros use 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# shed-proto, pinned by rev in Cargo.toml.
allow-git = ["https://github.com/jirathip-dev/shed"]

[graph]
# The platforms CI builds; Windows-only crates stay out of the checks.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

# #715 (q3523): egui's default fonts, the only text the desktop window draws with.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Web push needs p256 0.14 (0.13's crypto-bigint 0.5 has RUSTSEC-2026-0387), which is on RustCrypto's digest 0.11
# line while Topcoat (tungstenite's sha1 and rand) is still on digest 0.10 and rand_core 0.9: both lines stay until
# Topcoat moves.
skip = [
    { crate = "block-buffer@0.10.4", reason = "Topcoat's sha1; p256 0.14 / sha2 0.11 use 0.12" },
    { crate = "cpufeatures@0.2.17", reason = "Topcoat's sha1 and aes 0.8; sha2 0.11 uses 0.3" },
    { crate = "crypto-common@0.1.7", reason = "Topcoat's sha1 and aes-gcm 0.10; sha2 0.11 uses 0.2" },
    { crate = "digest@0.10.7", reason = "Topcoat's sha1; sha2 0.11 uses 0.11" },
    { crate = "rand_core@0.9.5", reason = "Topcoat's tungstenite; p256 0.14 uses 0.10 (traits only)" },
    { crate = "bitflags@1.3.2", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "block2@0.5.1", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "core-foundation@0.9.4", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "getrandom@0.3.4", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "linux-raw-sys@0.4.15", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "miniz_oxide@0.8.9", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "objc2@0.5.3", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "objc2-app-kit@0.2.2", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "objc2-foundation@0.2.2", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "rustix@0.38.44", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "thiserror@1.0.69", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "thiserror-impl@1.0.69", reason = "#715 (q3523): the desktop window's eframe/winit tree" },
    { crate = "syn@3.0.9", reason = "serde_derive, thiserror and futures macros; Topcoat's macros use 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# shed-proto and blocks, pinned by rev in Cargo.toml.
allow-git = ["https://github.com/jirathip-dev/shed", "https://github.com/jirathip-dev/blocks", "https://github.com/jirathip-dev/swag", "https://github.com/jirathip-dev/farrier"]

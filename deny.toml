[graph]
# The platforms CI builds; Windows-only crates stay out of the checks.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# p256 0.13 (web push) needs rand_core 0.6, traits only (no getrandom); Topcoat's tungstenite brings 0.9. p256 0.14
# would trade it for a second digest/sha2 instead.
skip = [{ crate = "rand_core@0.6.4", reason = "p256 0.13's elliptic-curve; Topcoat's tungstenite has 0.9" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# shed-proto, pinned by rev in Cargo.toml.
allow-git = ["https://github.com/jirathip-dev/shed"]

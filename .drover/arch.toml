# Written by scripts/gen.sh from .drover/arch/ (docs/architecture/hotspots-2026-11-16). Never edit it.
frozen = ["apple/Sources/CooeeApp/Live.swift", "apple/Sources/CooeeCore/Models.swift", "apple/Sources/CooeeFeatures/Clients.swift", "apple/Tests/CooeeUITests/Frames.swift", "apple/UITests/LiveUITests.swift", "ci/cap.toml", "crates/cooee-core/src/root.rs", "crates/cooee-server/src/root.rs", "docs/api.md", "docs/architecture.md", "docs/plugins.md", "justfile"]
generated = [".drover/arch.toml", "Cargo.lock", "README.md", "crates/cooee-core/src/chat.rs", "crates/cooee-core/src/lib.rs", "crates/cooee-core/src/shed.rs", "crates/cooee-core/src/store.rs", "crates/cooee-server/src/chief/tools/mod.rs", "crates/cooee-server/src/lib.rs", "crates/cooee-server/src/login.rs", "crates/cooee-server/src/mcp.rs", "crates/cooee-server/src/push.rs", "crates/cooee-server/src/routes/mod.rs", "crates/cooee-server/src/screens/mod.rs", "crates/cooee/src/cmd/mod.rs", "crates/cooee/tests/support/mod.rs"]
shared = [".github/workflows/apple.yml", ".github/workflows/ci.yml", "Cargo.toml", "crates/cooee-server/src/serve.rs", "crates/cooee/src/main.rs"]
generate = "scripts/gen.sh"

[[ban]]
pattern = "shed.approve"
paths = ["crates/cooee-server/src/**"]
except = ["crates/cooee-server/src/hub/approvals.rs"]
reason = "#503: a harness's permission request is answered only where cooee's rules decided: hub/approvals.rs"

[[collect]]
dir = "ci/cap.d"
glob = "*.toml"

[[collect]]
dir = "crates/cooee-server/src/chief/tools"
glob = "*.rs"

[[ban]]
pattern = ".approve("
paths = ["crates/cooee-server/src/chief.rs", "crates/cooee-server/src/chief/**"]
except = []
reason = "#664: Chief never answers a card, its own or another persona's"

[[ban]]
pattern = ".send"
paths = ["crates/cooee-server/src/chief.rs", "crates/cooee-server/src/chief/**"]
except = []
reason = "#664: Chief never sends as another persona: ask_persona is the only way to one, and it sends as Chief"

[[ban]]
pattern = ".queue("
paths = ["crates/cooee-server/src/chief.rs", "crates/cooee-server/src/chief/**"]
except = []
reason = "#664: a Chief tool never queues a message into a thread; the hub tells Chief its own card's outcome"

[[ban]]
pattern = "thread::sleep"
paths = ["crates/*/src/**"]
except = ["crates/cooee-core/src/clock.rs"]
reason = "#203: only the clock sleeps: use cooee_core::clock::sleep"

[[ban]]
pattern = "SystemTime::now"
paths = ["crates/*/src/**"]
except = ["crates/cooee-core/src/clock.rs"]
reason = "#203: only the clock reads the time: use cooee_core::clock::now"

[[ban]]
pattern = "Instant::now"
paths = ["crates/*/src/**"]
except = ["crates/cooee-core/src/clock.rs"]
reason = "#203: only the clock reads the time: use cooee_core::clock::instant"

[[ban]]
pattern = "env::var"
paths = ["crates/*/src/**"]
except = ["crates/cooee-core/src/config.rs"]
reason = "#203: only the config module reads the environment: use cooee_core::env_var"

[[size]]
paths = ["crates/*/src/**/*.rs"]
max_file_lines = 800

[[collect]]
dir = "crates/cooee-core/src"
glob = "*/*.rs"

[[collect]]
dir = "crates/cooee-server/src"
glob = "*/*.rs"

[[collect]]
dir = "crates/cooee-server/src/routes"
glob = "*.rs"

[[collect]]
dir = "crates/cooee-server/src/hub"
glob = "*.rs"

[[collect]]
dir = "apple/Sources/CooeeCore/Models"
glob = "*.swift"

[[collect]]
dir = "apple/UITests/Live"
glob = "*.swift"

[[ban]]
pattern = "routes::"
paths = ["crates/cooee-server/src/**"]
except = ["crates/cooee-server/src/serve.rs", "crates/cooee-server/src/routes/mod.rs"]
reason = "#356: a route area is reached only through routes::routes, from serve.rs; areas share through http.rs and the hub"

[[collect]]
dir = "apple/Sources/CooeeFeatures/Clients"
glob = "*.swift"

[[collect]]
dir = "apple/Sources/CooeeApp/Live"
glob = "*.swift"

[[collect]]
dir = "crates/cooee/src/cmd"
glob = "*.rs"

[[ban]]
pattern = "cmd::"
paths = ["crates/cooee/src/**"]
except = ["crates/cooee/src/main.rs", "crates/cooee/src/cmd/mod.rs"]
reason = "#356: a command is reached only through cmd::ALL, from main.rs; commands share through cli.rs"

[[collect]]
dir = "crates/cooee/tests/support"
glob = "*.rs"

[[collect]]
dir = "ci/gates"
glob = "*.sh"

[[collect]]
dir = "scripts"
glob = "*.sh"

[[collect]]
dir = "apple/e2e/steps"
glob = "*.sh"

[[collect]]
dir = "connectors"
glob = "*.toml"

[[collect]]
dir = "apple/Tests/CooeeUITests/Frames"
glob = "*.swift"

[[size]]
paths = ["Cargo.toml"]
max_file_lines = 100

[[size]]
paths = [".github/workflows/*.yml"]
max_file_lines = 200

[[collect]]
dir = ".drover/arch"

[[collect]]
dir = "scripts/gen.d"

[[ban]]
pattern = "Shelf"
paths = ["crates/cooee-server/src/**"]
except = ["crates/cooee-server/src/live.rs"]
reason = "#714: only live.rs publishes a screen: a screen module builds a Block and never diffs, puts or frames"

[[ban]]
pattern = "look.style"
paths = ["apple/Sources/CooeeUI/**"]
except = ["apple/Sources/CooeeUI/Look+Style.swift"]
reason = "#488: a view never reads the style: use Look+Style (label, radius, pill, surface, chip, Mark, FigureView, Stage)"

[[ban]]
pattern = "\"curl\""
paths = ["crates/cooee-server/src/**"]
except = ["crates/cooee-server/src/net.rs"]
reason = "#497: only net.rs starts curl: use net::fetch or net::stream, which follow no redirect and take headers on stdin"

[[ban]]
pattern = "cookie(cx"
paths = ["crates/cooee-server/src/**"]
except = ["crates/cooee-server/src/pairing.rs", "crates/cooee-server/src/routes/pairing.rs", "crates/cooee-server/src/screens/pair.rs"]
reason = "#714: a device cookie is set only where a code, a claim or a device key was checked"

[[collect]]
dir = "docs/plugins"
glob = "*.md"

[[ban]]
pattern = "history::watermark"
paths = ["crates/cooee-server/src/**"]
except = ["crates/cooee-server/src/routines/guard.rs", "crates/cooee-server/src/routines/builtin.rs", "crates/cooee-server/src/hub/heartbeat.rs", "crates/cooee-server/src/hub/mcp.rs"]
reason = "#690: a routine's line, cap and tally change only through the guard: use Runner::admit_due, admit_event, admit_wake, count"

[[ban]]
pattern = "Command::new"
paths = ["crates/*/src/**"]
except = ["crates/cooee-core/src/runner.rs"]
reason = "#202: only the runner starts a process: use cooee_core::runner::command"

[[ban]]
pattern = "launchctl"
paths = ["crates/*/src/**"]
except = ["crates/cooee/src/service.rs"]
reason = "#711: jobs are written, loaded and restarted only by farrier-service"

[[ban]]
pattern = "systemctl"
paths = ["crates/*/src/**"]
reason = "#711: jobs are written, loaded and restarted only by farrier-service"

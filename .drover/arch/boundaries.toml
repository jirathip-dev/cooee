[[ban]]
pattern = "logout"
paths = ["crates/*/src/**"]
except = ["crates/cooee-core/src/provider.rs"]
reason = "#762: provider facts (login, status, logout and usage commands, limits, resets, token var, config dir, adapter) are shed-catalog data; #764 moved accounts and their login to shed, #760 empties this list"

[[ban]]
pattern = "generic-password"
paths = ["crates/*/src/**"]
except = ["crates/cooee/src/keychain.rs"]
reason = "#762: shed stores credentials, tokens, secrets and account folders; #764 moved the account folders to shed, #760 empties this list"

[[ban]]
pattern = "docker"
paths = ["crates/*/src/**"]
except = []
reason = "#762: shed runs machines, VMs and containers; #760 keeps this list empty"

[[ban]]
pattern = "releases/"
paths = ["crates/*/src/**"]
except = ["crates/cooee/src/update.rs"]
reason = "#762: shed owns installs and updates, cooee never updates itself; #760 empties this list"

[[ban]]
pattern = "UnixStream"
paths = ["crates/*/src/**"]
except = []
reason = "#762: cooee talks to shed through shed-client, never its own shed protocol client; #760 emptied this list"

[[ban]]
pattern = "api/v1"
paths = ["crates/*/src/**"]
except = ["crates/cooee-server/src/screens/settings.rs"]
reason = "drover#1571: cooee reads a plugin's rows at the paths its manifest names; it holds no plugin route"

[[ban]]
pattern = "needs-decision"
paths = ["crates/*/src/**"]
except = []
reason = "drover#1571: cooee draws a row's block and never reads a workflow event kind"

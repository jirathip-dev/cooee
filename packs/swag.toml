# The first-party theme packs (docs/themes.md): jirathip-dev/swag's packs/<name>/ at one commit, each file with its
# sha256. The build vendors them into packs/themes/ (git-ignored) and into the binary, so an install with no network
# has them; a file that doesn't match its sha256 is never installed and fails the test. To take a change from swag,
# bump `commit` and the sums together; a new pack (bush) is four more lines.
url = "https://github.com/jirathip-dev/swag"

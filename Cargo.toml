[workspace]
resolver = "3"
members = ["crates/*", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jirathip-dev/cooee"
publish = false

[workspace.dependencies]
cooee-core = { path = "crates/cooee-core" }
cooee-server = { path = "crates/cooee-server" }
cooee-web = { path = "web" }
# Web push (herdsman's webpush.rs): RFC 8291 encryption and the ES256 VAPID JWT; paired-device token hashes.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
base64 = "=0.22.1"
hkdf = "=0.13.0"
p256 = { version = "=0.14.0", default-features = false, features = ["ecdh", "ecdsa"] }
sha2 = "=0.11.1"
# `cooee pair`'s QR code in the terminal.
qrcode = { version = "=0.14.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# shed's API types, pinned to a shed merge commit; the hello needs the exact shed version.
shed-proto = { git = "https://github.com/jirathip-dev/shed", rev = "8bac04fdb8542ef496c614b47126d85c50a7892e" }
futures-util = { version = "=0.3.34", default-features = false }
thiserror = "=2.0.21"
# Pinned exactly (ADR 0001): Topcoat is pre-1.0 and its minors break.
topcoat = { version = "=0.11.0", default-features = false, features = ["serve", "sse"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync"] }
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"

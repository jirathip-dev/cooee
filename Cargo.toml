[workspace]
resolver = "3"
members = ["crates/*", "web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jirathip-dev/cooee"
publish = false

[workspace.dependencies]
cooee-core = { path = "crates/cooee-core" }
cooee-server = { path = "crates/cooee-server" }
cooee-web = { path = "web" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
# Pinned exactly (ADR 0001): Topcoat is pre-1.0 and its minors break.
topcoat = { version = "=0.11.0", default-features = false, features = ["serve"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net"] }
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
